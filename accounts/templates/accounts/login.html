{% extends 'base.html' %}

{% block content %}
<section class="hero" style="padding: 40px 0;">
    <div class="container">
        <h1>Welcome Back</h1>
        <p>Log in to manage your deliveries</p>
    </div>
</section>

<section>
    <div class="container">
        <div class="row">
            <div class="col-lg-5 offset-lg-3">
                <form method="post" class="bg-white p-5 rounded-3 shadow-sm">
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                    <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                    {% endif %}
                    <div class="mb-4">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Email *</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-4">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Password *</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">Log In</button>
                    <p class="text-center mt-4 mb-0">Don't have an account? <a
                            href="{% url 'accounts:register' %}">Register</a></p>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
